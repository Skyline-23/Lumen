name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests and lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  macos:
    name: macOS tests
    runs-on: macos-26
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target/arm64/debug
            build/rust-target/arm64/aarch64-apple-darwin/debug
            ~/Library/Developer/Xcode/DerivedData/Lumen-*/Build
            ~/Library/Developer/Xcode/DerivedData/Lumen-*/SourcePackages
          key: lumen-macos-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'src/platform/macos/Project.swift') }}
          restore-keys: |
            lumen-macos-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          brew install --cask tuist
      - name: Build macOS Rust libraries
        run: |
          CONFIGURATION=Debug \
          ARCHS=arm64 \
          CURRENT_ARCH=undefined_arch \
            scripts/rust/build_lumen_engine.sh
      - name: Test Lumen app
        working-directory: src/platform/macos
        run: tuist test --no-selective-testing --no-binary-cache LumenTuistTests
      - name: Build Lumen app
        working-directory: src/platform/macos
        run: |
          tuist generate --no-open
          tuist xcodebuild build \
            -workspace Lumen.xcworkspace \
            -scheme LumenApp \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

  windows:
    name: Windows package check
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: cmake-build-release/rust-target
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> cmake-build-release/rust-target"
          shared-key: windows-gnu-package
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib
      - name: Build unsigned NSIS installer
        shell: msys2 {0}
        env:
          LUMEN_VERSION: 0.0.0
          LUMEN_ARTIFACT_VERSION: 0.0.0
        run: |
          scripts/ci/build_windows_package.sh
          test -s cmake-build-release/cpack_artifacts/Lumen-0.0.0-Windows-x86_64.exe
      - name: Upload unsigned NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: lumen-windows-unsigned-${{ github.sha }}
          path: cmake-build-release/cpack_artifacts/Lumen-0.0.0-Windows-x86_64.exe
          if-no-files-found: error
          retention-days: 3
