name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      windows_driver: ${{ steps.filter.outputs.windows_driver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            rust:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'engine/**'
              - 'scripts/rust/**'
              - 'src/platform/windows/driver/core/**'
              - 'src/platform/windows/driver/include/**'
            macos:
              - '.github/workflows/ci.yml'
              - '.mise.toml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'engine/**'
              - 'scripts/rust/**'
              - 'src/platform/macos/**'
            windows:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'CMakeLists.txt'
              - 'assets/windows/**'
              - 'cmake/**'
              - 'engine/**'
              - 'packaging/windows/**'
              - 'scripts/ci/build_windows_package.sh'
              - 'scripts/ci/test_windows_installation.ps1'
              - 'src/platform/windows/**'
              - 'third-party/**'
              - 'tools/**'
            windows_driver:
              - '.github/workflows/ci.yml'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'src/platform/windows/driver/**'

  rust:
    name: Rust tests and lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Rust and cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: aarch64-apple-darwin
          cache-bin: "false"
          cache-on-failure: "false"
          rustflags: ""
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  macos:
    name: macOS tests
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Rust and cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: aarch64-apple-darwin
          cache-workspaces: ". -> build/rust-target/arm64"
          cache-shared-key: macos
          cache-bin: "false"
          cache-on-failure: "false"
          rustflags: ""
      - name: Set up Tuist
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Build macOS Rust libraries
        run: |
          CONFIGURATION=Debug \
          ARCHS=arm64 \
          CURRENT_ARCH=undefined_arch \
            scripts/rust/build_lumen_engine.sh
      - name: Test Lumen app
        working-directory: src/platform/macos
        run: tuist test --no-selective-testing --no-binary-cache LumenTuistTests
      - name: Build Lumen app
        working-directory: src/platform/macos
        run: |
          tuist generate --no-open
          tuist xcodebuild build \
            -workspace Lumen.xcworkspace \
            -scheme LumenApp \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
          app_path="$(find "${HOME}/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug/Lumen.app' -print -quit)"
          test -n "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"

  windows:
    name: Windows package check
    needs: [changes, windows-driver]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: cmake-build-release/rust-target
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Rust and cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: x86_64-pc-windows-gnu
          cache-workspaces: ". -> cmake-build-release/rust-target"
          cache-shared-key: windows-gnu-package
          cache-bin: "false"
          cache-on-failure: "false"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Download unsigned IDD package
        uses: actions/download-artifact@v8
        with:
          name: lumen-windows-idd-unsigned-${{ github.sha }}
          path: build/windows-driver-package
      - name: Verify IDD package inputs
        shell: pwsh
        run: |
          @("LumenIddCx.dll", "LumenIddCx.inf", "lumeniddcx.cat") | ForEach-Object {
            $path = Join-Path "build\windows-driver-package" $_
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing Windows IDD package input: $path"
            }
          }
      - name: Build unsigned MSI installer
        shell: msys2 {0}
        env:
          LUMEN_VERSION: 0.0.0
          LUMEN_ARTIFACT_VERSION: 0.0.0
          LUMEN_WINDOWS_DRIVER_PACKAGE_DIR: build/windows-driver-package
        run: |
          scripts/ci/build_windows_package.sh
          test -s cmake-build-release/cpack_artifacts/Lumen-0.0.0-Windows-x86_64.msi
      - name: Upload unsigned MSI installer
        uses: actions/upload-artifact@v7
        with:
          name: lumen-windows-unsigned-${{ github.sha }}
          path: cmake-build-release/cpack_artifacts/Lumen-0.0.0-Windows-x86_64.msi
          if-no-files-found: error
          retention-days: 3

  windows-driver:
    name: Windows IDD compile
    needs: changes
    if: needs.changes.outputs.windows_driver == 'true' || needs.changes.outputs.windows == 'true'
    runs-on: windows-2025-vs2026
    env:
      CARGO_TARGET_DIR: target
      RUSTFLAGS: -D warnings
      DRIVER_PROJECT: src\platform\windows\driver\LumenIddCx.vcxproj
      DRIVER_CORE: target\x86_64-pc-windows-msvc\release\lumen_windows_driver_core.lib
      DRIVER_OUTPUT: src\platform\windows\driver\build\bin\x64\Release
      WDK_PACKAGE_VERSION: 10.0.28000.1839
      WDK_PLATFORM_VERSION: 10.0.28000.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Set up Rust and cache
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: x86_64-pc-windows-msvc
          cache-workspaces: ". -> target"
          cache-shared-key: windows-msvc-driver
          cache-bin: "false"
          cache-on-failure: "false"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages/microsoft.windows.wdk.x64
            ~/.nuget/packages/microsoft.windows.sdk.cpp
            ~/.nuget/packages/microsoft.windows.sdk.cpp.x64
          key: lumen-wdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/platform/windows/driver/LumenIddCx.vcxproj') }}
          restore-keys: |
            lumen-wdk-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build Rust driver core
        shell: pwsh
        run: |
          cargo build --locked -p lumen-windows-driver-core --release --target x86_64-pc-windows-msvc
          if (-not (Test-Path $env:DRIVER_CORE)) { throw "Missing Rust driver core: $env:DRIVER_CORE" }
      - name: Restore WDK and compile IDD
        shell: pwsh
        run: |
          $driverCore = (Resolve-Path $env:DRIVER_CORE).Path
          msbuild $env:DRIVER_PROJECT /t:Restore
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed." }
          $wdkTools = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.windows.wdk.x64\$env:WDK_PACKAGE_VERSION\c\bin\$env:WDK_PLATFORM_VERSION\x64"
          if (-not (Test-Path (Join-Path $wdkTools "stampinf.exe"))) { throw "Missing WDK x64 tools: $wdkTools" }
          $env:PATH = "$wdkTools;$env:PATH"
          $infToolPath = "$wdkTools\"
          msbuild $env:DRIVER_PROJECT /m /t:Build /p:Configuration=Release /p:Platform=x64 "/p:LumenDriverCoreLibrary=$driverCore" "/p:InfToolPath=$infToolPath" /p:InfToolArchitecture=Native64Bit
          if ($LASTEXITCODE -ne 0) { throw "WDK UMDF2 driver build failed." }
          $driverBinary = Join-Path $env:DRIVER_OUTPUT "LumenIddCx.dll"
          if (-not (Test-Path $driverBinary)) { throw "Missing driver output: $driverBinary" }
      - name: Upload unsigned IDD package
        uses: actions/upload-artifact@v7
        with:
          name: lumen-windows-idd-unsigned-${{ github.sha }}
          path: src/platform/windows/driver/build/bin/x64/Release/LumenIddCx/*
          if-no-files-found: error
          retention-days: 3
