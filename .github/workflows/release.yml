name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      product_version: ${{ steps.version.outputs.product_version }}
      release_version: ${{ steps.version.outputs.release_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve product version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-beta\.([1-9][0-9]*))?$ ]] || {
            echo "Release tag must use v1.2.3 or v1.2.3-beta.N: ${tag}" >&2
            exit 1
          }
          product_version="${BASH_REMATCH[1]}"
          release_version="${tag#v}"
          prerelease=false
          [[ -z "${BASH_REMATCH[2]}" ]] || prerelease=true
          if [[ "${prerelease}" == "true" ]]; then
            git fetch --no-tags origin develop
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/develop || {
              echo "Beta release tag ${tag} must point at a commit contained in develop" >&2
              exit 1
            }
          else
            git fetch --no-tags origin main
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo "Stable release tag ${tag} must point at a commit contained in main" >&2
              exit 1
            }
          fi
          engine_version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' engine/lumen-engine/Cargo.toml)"
          host_version="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' engine/lumen-host/Cargo.toml)"
          [[ "${engine_version}" == "${host_version}" ]] || {
            echo "Lumen crate versions must match: engine=${engine_version}, host=${host_version}" >&2
            exit 1
          }
          [[ "${host_version}" == "${product_version}" ]] || {
            echo "Release tag ${tag} does not match product version ${host_version}" >&2
            exit 1
          }
          {
            echo "tag=${tag}"
            echo "product_version=${product_version}"
            echo "release_version=${release_version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  macos:
    name: Signed macOS package
    needs: prepare
    runs-on: macos-26
    defaults:
      run:
        shell: zsh {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust-target
            ~/.cache/tuist
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: lumen-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'src/platform/macos/Project.swift') }}
          restore-keys: |
            lumen-release-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate Apple release secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          for variable in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID; do
            if [[ -z "${(P)variable}" ]]; then
              print -u2 "Missing required release secret: ${variable}"
              exit 1
            fi
          done
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          brew install --cask tuist
      - name: Configure signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/lumen-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/lumen-release.p12"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          print -rn -- "${APPLE_CERTIFICATE_P12_BASE64}" | /usr/bin/base64 -D > "${CERTIFICATE_PATH}"
          print -rn -- "${APPLE_NOTARY_KEY_BASE64}" | /usr/bin/base64 -D > "${NOTARY_KEY_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | sed -n 's/.*"\(.*\)"/\1/p' | head -1)"
          [[ -n "${SIGNING_IDENTITY}" ]] || { print -u2 "No code-signing identity was imported"; exit 1; }
          xcrun notarytool store-credentials lumen-release \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}"
          print "LUMEN_SIGNING_IDENTITY=${SIGNING_IDENTITY}" >> "${GITHUB_ENV}"
          print "LUMEN_NOTARY_PROFILE=lumen-release" >> "${GITHUB_ENV}"
          print "LUMEN_RELEASE_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          print "LUMEN_RELEASE_CERTIFICATE=${CERTIFICATE_PATH}" >> "${GITHUB_ENV}"
          print "LUMEN_RELEASE_NOTARY_KEY=${NOTARY_KEY_PATH}" >> "${GITHUB_ENV}"
      - name: Build, sign, and notarize DMG
        env:
          LUMEN_BUILD_NUMBER: ${{ github.run_number }}
          LUMEN_OUTPUT_DIR: ${{ github.workspace }}/build/release-artifacts
          LUMEN_PRODUCT_VERSION: ${{ needs.prepare.outputs.product_version }}
          LUMEN_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          BUILD_ROOT="${GITHUB_WORKSPACE}/build/macos-release"
          DERIVED_DATA="${BUILD_ROOT}/DerivedData"
          STAGING_ROOT="${BUILD_ROOT}/dmg-root"
          SOURCE_APP="${DERIVED_DATA}/Build/Products/Release/Lumen.app"
          STAGED_APP="${STAGING_ROOT}/Lumen.app"
          DMG_PATH="${LUMEN_OUTPUT_DIR}/Lumen-${LUMEN_RELEASE_VERSION}-macOS.dmg"

          mkdir -p "${BUILD_ROOT}" "${LUMEN_OUTPUT_DIR}" "${STAGING_ROOT}"
          CONFIGURATION=Release \
          ARCHS=arm64 \
          CURRENT_ARCH=arm64 \
            scripts/rust/build_lumen_engine.sh

          cd src/platform/macos
          tuist generate --no-open
          tuist xcodebuild build \
            -workspace Lumen.xcworkspace \
            -scheme LumenApp \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            "MARKETING_VERSION=${LUMEN_PRODUCT_VERSION}" \
            "CURRENT_PROJECT_VERSION=${LUMEN_BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=${LUMEN_SIGNING_IDENTITY}" \
            DEVELOPMENT_TEAM=Q23JLSJCCV
          cd "${GITHUB_WORKSPACE}"

          test -d "${SOURCE_APP}"
          ditto "${SOURCE_APP}" "${STAGED_APP}"
          codesign --verify --deep --strict --verbose=2 "${STAGED_APP}"
          test "$(lipo -archs "${STAGED_APP}/Contents/MacOS/LumenHostWorker")" = 'arm64'
          ln -s /Applications "${STAGING_ROOT}/Applications"
          hdiutil create \
            -volname Lumen \
            -srcfolder "${STAGING_ROOT}" \
            -format UDZO \
            -imagekey zlib-level=9 \
            -ov \
            "${DMG_PATH}"
          codesign --force --timestamp --sign "${LUMEN_SIGNING_IDENTITY}" "${DMG_PATH}"
          codesign --verify --verbose=2 "${DMG_PATH}"
          xcrun notarytool submit "${DMG_PATH}" \
            --keychain-profile "${LUMEN_NOTARY_PROFILE}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: lumen-macos-release
          path: build/release-artifacts/Lumen-*-macOS.dmg
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          [[ -z "${LUMEN_RELEASE_KEYCHAIN:-}" ]] || security delete-keychain "${LUMEN_RELEASE_KEYCHAIN}" || true
          [[ -z "${LUMEN_RELEASE_CERTIFICATE:-}" ]] || rm -f "${LUMEN_RELEASE_CERTIFICATE}"
          [[ -z "${LUMEN_RELEASE_NOTARY_KEY:-}" ]] || rm -f "${LUMEN_RELEASE_NOTARY_KEY}"

  windows-driver:
    name: Windows IDD release build
    needs: prepare
    runs-on: windows-2025-vs2026
    env:
      CARGO_TARGET_DIR: target
      RUSTFLAGS: -D warnings
      DRIVER_PROJECT: src\platform\windows\driver\LumenIddCx.vcxproj
      DRIVER_CORE: target\x86_64-pc-windows-msvc\release\lumen_windows_driver_core.lib
      DRIVER_OUTPUT: src\platform\windows\driver\build\bin\x64\Release
      WDK_PACKAGE_VERSION: 10.0.28000.1839
      WDK_PLATFORM_VERSION: 10.0.28000.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Install the MSVC Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: windows-msvc-driver
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "false"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages/microsoft.windows.wdk.x64
            ~/.nuget/packages/microsoft.windows.sdk.cpp
            ~/.nuget/packages/microsoft.windows.sdk.cpp.x64
          key: lumen-wdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/platform/windows/driver/LumenIddCx.vcxproj') }}
          restore-keys: |
            lumen-wdk-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the Rust driver core
        shell: pwsh
        run: |
          cargo build --locked -p lumen-windows-driver-core --release --target x86_64-pc-windows-msvc
          if (-not (Test-Path $env:DRIVER_CORE)) {
            throw "Missing Rust driver core: $env:DRIVER_CORE"
          }
      - name: Restore WDK and compile IDD
        shell: pwsh
        run: |
          $driverCore = (Resolve-Path $env:DRIVER_CORE).Path
          msbuild $env:DRIVER_PROJECT /t:Restore
          if ($LASTEXITCODE -ne 0) { throw "WDK NuGet restore failed." }
          $wdkTools = Join-Path $env:USERPROFILE ".nuget\packages\microsoft.windows.wdk.x64\$env:WDK_PACKAGE_VERSION\c\bin\$env:WDK_PLATFORM_VERSION\x64"
          if (-not (Test-Path (Join-Path $wdkTools "stampinf.exe"))) {
            throw "Missing WDK x64 tools: $wdkTools"
          }
          $env:PATH = "$wdkTools;$env:PATH"
          $infToolPath = "$wdkTools\"
          msbuild $env:DRIVER_PROJECT /m /t:Build /p:Configuration=Release /p:Platform=x64 "/p:LumenDriverCoreLibrary=$driverCore" "/p:InfToolPath=$infToolPath" /p:InfToolArchitecture=Native64Bit
          if ($LASTEXITCODE -ne 0) { throw "WDK UMDF2 driver build failed." }
          @("LumenIddCx.dll", "LumenIddCx.inf", "lumeniddcx.cat") | ForEach-Object {
            $path = Join-Path $env:DRIVER_OUTPUT $_
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing IDD release input: $path"
            }
          }
      - name: Upload unsigned IDD package
        uses: actions/upload-artifact@v7
        with:
          name: lumen-windows-idd-unsigned-${{ github.sha }}
          path: src/platform/windows/driver/build/bin/x64/Release/LumenIddCx/*
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Signed Windows package
    needs: [prepare, windows-driver]
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: cmake-build-release/rust-target
      RUSTFLAGS: -D warnings
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate SignPath release configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          @(
            "SIGNPATH_API_TOKEN",
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          ) | ForEach-Object {
            if (-not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value) {
              throw "Missing required SignPath release setting: $_"
            }
          }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-zlib
      - uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          key: windows-gnu-package
          max-size: 250M
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: packaging/windows/Lumen.wixproj
      - name: Install the GNU Rust target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> cmake-build-release/rust-target"
          shared-key: windows-gnu-package
          add-job-id-key: "false"
          cache-bin: "false"
          cache-on-failure: "false"
      - name: Download unsigned IDD package
        uses: actions/download-artifact@v8
        with:
          name: lumen-windows-idd-unsigned-${{ github.sha }}
          path: build/windows-driver-package
      - name: Verify IDD package inputs
        shell: pwsh
        run: |
          @("LumenIddCx.dll", "LumenIddCx.inf", "lumeniddcx.cat") | ForEach-Object {
            $path = Join-Path "build\windows-driver-package" $_
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing Windows IDD package input: $path"
            }
          }
      - name: Build MSI installer
        shell: msys2 {0}
        env:
          LUMEN_VERSION: ${{ needs.prepare.outputs.product_version }}
          LUMEN_ARTIFACT_VERSION: ${{ needs.prepare.outputs.release_version }}
          LUMEN_CMAKE_COMPILER_LAUNCHER: sccache
          LUMEN_WINDOWS_DRIVER_PACKAGE_DIR: build/windows-driver-package
        run: scripts/ci/build_windows_package.sh
      - name: Upload unsigned Windows installer for SignPath
        id: upload_unsigned_windows
        uses: actions/upload-artifact@v7
        with:
          name: lumen-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: cmake-build-release/cpack_artifacts/Lumen-*-Windows-x86_64.msi
          if-no-files-found: error
          retention-days: 1
      - name: Submit Windows installer to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signpath-signed
      - name: Verify signed Windows installer
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe was not found" }
          $installer = Get-ChildItem "build\signpath-signed\Lumen-*-Windows-x86_64.msi" -Recurse |
            Select-Object -First 1
          if (-not $installer) { throw "SignPath did not return the signed Lumen installer" }
          & $signtool.FullName verify /pa /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSI Authenticode verification failed" }

          $adminImage = Join-Path $env:RUNNER_TEMP "lumen-signed-msi"
          New-Item -ItemType Directory -Force $adminImage | Out-Null
          $msiArguments = @(
            "/a",
            "`"$($installer.FullName)`"",
            "/qn",
            "TARGETDIR=`"$adminImage`""
          )
          $administrativeInstall = Start-Process msiexec.exe `
            -ArgumentList $msiArguments `
            -Wait `
            -PassThru
          if ($administrativeInstall.ExitCode -ne 0) {
            throw "Could not expand signed MSI; msiexec exited with $($administrativeInstall.ExitCode)"
          }

          function Get-SingleSignedPayload([string]$LeafName) {
            $matches = @(Get-ChildItem $adminImage -Recurse -File -Filter $LeafName)
            if ($matches.Count -ne 1) {
              throw "Expected one signed $LeafName payload, found $($matches.Count)"
            }
            return $matches[0]
          }

          @(
            "Lumen.exe",
            "LumenService.exe",
            "LumenDriverSetup.exe"
          ) | ForEach-Object {
            $payload = Get-SingleSignedPayload $_
            & $signtool.FullName verify /pa /v $payload.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Nested Authenticode verification failed for $($_)"
            }
          }

          $catalog = Get-SingleSignedPayload "lumeniddcx.cat"
          $driver = Get-SingleSignedPayload "LumenIddCx.dll"
          & $signtool.FullName verify /pa /v $catalog.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "IDD catalog Authenticode verification failed"
          }
          & $signtool.FullName verify /pa /v /c $catalog.FullName $driver.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "IDD binary does not match the signed catalog"
          }

          New-Item -ItemType Directory -Force "build\release-artifacts" | Out-Null
          Copy-Item $installer.FullName "build\release-artifacts\$($installer.Name)"
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: lumen-windows-release
          path: build/release-artifacts/Lumen-*-Windows-x86_64.msi
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: lumen-*-release
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          LUMEN_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          release_flags=()
          [[ "${LUMEN_PRERELEASE}" != "true" ]] || release_flags+=(--prerelease)
          gh release create "${{ needs.prepare.outputs.tag }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --title "Lumen ${{ needs.prepare.outputs.tag }}" \
            "${release_flags[@]}"

  homebrew:
    name: Update Homebrew tap
    needs: [prepare, publish]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: macos-15
    defaults:
      run:
        shell: zsh {0}
    steps:
      - name: Validate Homebrew tap secret
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: |
          [[ -n "${HOMEBREW_TAP_SSH_KEY}" ]] || { print -u2 "Missing HOMEBREW_TAP_SSH_KEY"; exit 1; }
      - uses: actions/checkout@v7
        with:
          path: source
      - uses: actions/checkout@v7
        with:
          repository: Skyline-23/homebrew-lumen
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: lumen-macos-release
          path: artifacts
      - name: Render and publish cask
        run: |
          source/scripts/release/render_homebrew_cask.sh \
            "${{ needs.prepare.outputs.product_version }}" \
            artifacts/Lumen-${{ needs.prepare.outputs.release_version }}-macOS.dmg \
            homebrew-tap/Casks/lumen.rb
          cd homebrew-tap
          brew style --cask Casks/lumen.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lumen.rb
          if git diff --cached --quiet; then
            print "Homebrew cask is already current."
            exit 0
          fi
          git commit -m "chore: Update Lumen to ${{ needs.prepare.outputs.product_version }}"
          git push
